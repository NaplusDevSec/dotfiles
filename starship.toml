# ==============================================================================
# STARSHIP PROMPT CONFIGURATION (Dotfiles / Server & Workstation Setup)
# ==============================================================================
format = """
[╭─](bold bright-black)$username$hostname$directory$git_branch$git_status
[╰─❯ ](bold cyan)"""

# ==============================================================================
# USERNAME & HOSTNAME MODULES (Active only during SSH or root sessions)
# ==============================================================================
[username]
show_always = false             # Hide username on local terminal sessions
style_user = "bold green"
format = "[$user]($style)@"

[hostname]
ssh_only = true                 # Display hostname only when connected via SSH
style = "bold blue"
format = "[$hostname]($style) "

# ==============================================================================
# DIRECTORY MODULE
# ==============================================================================
[directory]
style = "bold purple"
truncation_length = 0          # Display the full directory path without truncation
truncate_to_repo = false       # Keep full path visible inside Git repositories
home_symbol = "~"              # Use ~ to represent the home directory

# ==============================================================================
# GIT MODULES
# ==============================================================================
[git_branch]
symbol = " "                  # Branch icon (Nerd Font)
style = "bold yellow"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"
